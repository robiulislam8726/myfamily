<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Expense Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>Family Expense Tracker</h1>
  <div class="header-note">Sonchita Biswas (কাজের লোক) টাকা চুরি করা যাবে 😊</div>
</header>

<div class="layout">

  <aside class="side-panel side-left">
    <div class="card quick-card">
      <h3>🥦 Vegetables</h3>
      <div class="quick-grid">
        <button type="button" class="quick-item" data-category="Food" data-detail="Vegetables">
          <span class="icon">🥦</span><span class="label">Vegetables</span>
        </button>
        <button type="button" class="quick-item" data-category="Food" data-detail="Carrot">
          <span class="icon">🥕</span><span class="label">Carrot</span>
        </button>
        <button type="button" class="quick-item" data-category="Food" data-detail="Onion">
          <span class="icon">🧅</span><span class="label">Onion</span>
        </button>
        <button type="button" class="quick-item" data-category="Food" data-detail="Potato">
          <span class="icon">🥔</span><span class="label">Potato</span>
        </button>
      </div>
    </div>
  </aside>

<main>

  <!-- Month summary -->
  <div class="card">
    <div class="summary-header">
      <h2>Monthly Summary</h2>
      <div class="budget-badge">Budget: <span id="budgetAmount"></span></div>
    </div>

    <div class="month-nav">
      <button id="prevMonth">&lt;</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth">&gt;</button>
    </div>

    <div class="total-amount" id="totalAmount">¥0</div>

    <div class="balance-row">
      <span>Balance: <span class="balance-amount" id="balanceAmount">¥0</span></span>
      <button class="btn-alert" id="alertBtn" style="display:none;">⚠ কম করে খেতে হবে!</button>
    </div>

    <div id="categoryBreakdown"></div>
  </div>

  <!-- Add expense -->
  <div class="card">
    <h2>Add Expense</h2>
    <form class="expense-form" id="expenseForm">
      <div>
        <label for="categorySelect">Category</label>
        <select id="categorySelect" required></select>
      </div>

      <div>
        <label for="amountInput">Amount</label>
        <input type="number" id="amountInput" min="0" step="1" placeholder="e.g. 3000" required />
      </div>

      <div>
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput" required />
      </div>

      <div>
        <label for="detailInput">Detail (e.g. Milk)</label>
        <input type="text" id="detailInput" placeholder="optional" />
      </div>

      <div class="full">
        <label for="memoInput">Memo</label>
        <input type="text" id="memoInput" placeholder="optional" />
      </div>

      <div class="full">
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>

    <div class="add-category">
      <input type="text" id="newCategoryInput" placeholder="New category name" />
      <button class="btn btn-outline" id="addCategoryBtn">Add Category</button>
    </div>
  </div>

  <!-- List -->
  <div class="card">
    <h2>Expense List (<span id="listMonthLabel"></span>)</h2>
    <div id="expenseListWrap">
      <table id="expenseTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Detail / Memo</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expenseTbody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">No expenses recorded this month</div>
    </div>
  </div>

  <!-- Backup -->
  <div class="card">
    <h2>Backup</h2>
    <div class="footer-actions">
      <button class="btn btn-outline" id="exportBtn">Export as JSON</button>
      <button class="btn btn-outline" id="importBtn">Import from JSON</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;" />
  </div>

</main>

  <aside class="side-panel side-right">
    <div class="card quick-card">
      <h3>🍖 Meat &amp; Dairy</h3>
      <div class="quick-grid">
        <button type="button" class="quick-item" data-category="Food" data-detail="Meat">
          <span class="icon">🥩</span><span class="label">Meat</span>
        </button>
        <button type="button" class="quick-item" data-category="Food" data-detail="鶏肉 (Chicken)">
          <span class="icon">🐔</span><span class="label">鶏肉 Chicken</span>
        </button>
        <button type="button" class="quick-item" data-category="Food" data-detail="Milk">
          <span class="icon">🥛</span><span class="label">Milk</span>
        </button>
        <button type="button" class="quick-item" data-category="Food" data-detail="Egg">
          <span class="icon">🥚</span><span class="label">Egg</span>
        </button>
      </div>
    </div>
  </aside>

</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "myfamily_expenses_v1";
  const CATEGORY_KEY = "myfamily_categories_v1";

  const DEFAULT_CATEGORIES = ["Baby Expenses", "Rent", "Utilities", "Food", "Personal"];
  const MONTHLY_BUDGET = 60000;
  const LOW_BALANCE_THRESHOLD = 10000;

  /** @returns {Array} */
  function loadExpenses() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error("failed to load expenses", e);
      return [];
    }
  }

  function saveExpenses(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function loadCategories() {
    try {
      const raw = localStorage.getItem(CATEGORY_KEY);
      const list = raw ? JSON.parse(raw) : null;
      return list && list.length ? list : DEFAULT_CATEGORIES.slice();
    } catch (e) {
      return DEFAULT_CATEGORIES.slice();
    }
  }

  function saveCategories(list) {
    localStorage.setItem(CATEGORY_KEY, JSON.stringify(list));
  }

  let expenses = loadExpenses();
  let categories = loadCategories();
  let currentMonth = new Date().toISOString().substring(0, 7); // YYYY-MM

  const monthLabelEl = document.getElementById("monthLabel");
  const listMonthLabelEl = document.getElementById("listMonthLabel");
  const totalAmountEl = document.getElementById("totalAmount");
  const budgetAmountEl = document.getElementById("budgetAmount");
  const balanceAmountEl = document.getElementById("balanceAmount");
  const alertBtn = document.getElementById("alertBtn");
  const categoryBreakdownEl = document.getElementById("categoryBreakdown");
  const expenseTbody = document.getElementById("expenseTbody");
  const emptyMsg = document.getElementById("emptyMsg");
  const categorySelect = document.getElementById("categorySelect");
  const dateInput = document.getElementById("dateInput");

  function formatYen(n) {
    return "¥" + Math.round(n).toLocaleString("en-US");
  }

  function formatMonthLabel(ym) {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1, 1);
    return d.toLocaleDateString("en-US", { year: "numeric", month: "long" });
  }

  function shiftMonth(ym, delta) {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }

  function renderCategoryOptions() {
    categorySelect.innerHTML = "";
    categories.forEach((cat) => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    });
  }

  function expensesForMonth(ym) {
    return expenses.filter((e) => e.date.substring(0, 7) === ym);
  }

  function render() {
    monthLabelEl.textContent = formatMonthLabel(currentMonth);
    listMonthLabelEl.textContent = formatMonthLabel(currentMonth);

    const monthExpenses = expensesForMonth(currentMonth);
    const total = monthExpenses.reduce((sum, e) => sum + e.amount, 0);
    totalAmountEl.textContent = formatYen(total);

    budgetAmountEl.textContent = formatYen(MONTHLY_BUDGET);

    const balance = MONTHLY_BUDGET - total;
    balanceAmountEl.textContent = formatYen(balance);
    balanceAmountEl.classList.toggle("low", balance < LOW_BALANCE_THRESHOLD);
    alertBtn.style.display = balance < LOW_BALANCE_THRESHOLD ? "inline-flex" : "none";

    // category breakdown
    const byCategory = {};
    monthExpenses.forEach((e) => {
      byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
    });

    categoryBreakdownEl.innerHTML = "";
    const maxAmount = Math.max(1, ...Object.values(byCategory));

    categories
      .filter((cat) => byCategory[cat])
      .sort((a, b) => byCategory[b] - byCategory[a])
      .forEach((cat) => {
        const amount = byCategory[cat];
        const row = document.createElement("div");
        row.className = "cat-row";
        row.innerHTML =
          '<div class="cat-name">' + escapeHtml(cat) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' +
          Math.round((amount / maxAmount) * 100) +
          '%"></div></div>' +
          '<div class="cat-amount">' + formatYen(amount) + '</div>';
        categoryBreakdownEl.appendChild(row);
      });

    // list
    expenseTbody.innerHTML = "";
    const sorted = monthExpenses.slice().sort((a, b) => b.date.localeCompare(a.date));

    if (sorted.length === 0) {
      emptyMsg.style.display = "block";
    } else {
      emptyMsg.style.display = "none";
      sorted.forEach((e) => {
        const tr = document.createElement("tr");
        const detailMemo = [e.detail, e.memo].filter(Boolean).join(" / ");
        tr.innerHTML =
          "<td>" + e.date + "</td>" +
          "<td>" + escapeHtml(e.category) + "</td>" +
          "<td>" + escapeHtml(detailMemo) + "</td>" +
          '<td class="amount">' + formatYen(e.amount) + "</td>" +
          '<td><button class="btn-danger" data-id="' + e.id + '">Delete</button></td>';
        expenseTbody.appendChild(tr);
      });
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  // -- events --

  document.getElementById("prevMonth").addEventListener("click", () => {
    currentMonth = shiftMonth(currentMonth, -1);
    render();
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    currentMonth = shiftMonth(currentMonth, 1);
    render();
  });

  document.getElementById("expenseForm").addEventListener("submit", (event) => {
    event.preventDefault();

    const category = categorySelect.value;
    const amount = Number(document.getElementById("amountInput").value);
    const date = dateInput.value;
    const detail = document.getElementById("detailInput").value.trim();
    const memo = document.getElementById("memoInput").value.trim();

    if (!category || !amount || !date) return;

    expenses.push({
      id: Date.now().toString(36) + Math.random().toString(36).substring(2, 6),
      category,
      amount,
      date,
      detail,
      memo
    });

    saveExpenses(expenses);

    currentMonth = date.substring(0, 7);
    document.getElementById("expenseForm").reset();
    dateInput.value = new Date().toISOString().substring(0, 10);
    render();
  });

  document.getElementById("addCategoryBtn").addEventListener("click", () => {
    const input = document.getElementById("newCategoryInput");
    const name = input.value.trim();
    if (!name || categories.includes(name)) return;

    categories.push(name);
    saveCategories(categories);
    renderCategoryOptions();
    categorySelect.value = name;
    input.value = "";
  });

  expenseTbody.addEventListener("click", (event) => {
    const btn = event.target.closest("button[data-id]");
    if (!btn) return;

    const id = btn.getAttribute("data-id");
    if (!confirm("Delete this record?")) return;

    expenses = expenses.filter((e) => e.id !== id);
    saveExpenses(expenses);
    render();
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    const data = { expenses, categories };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "myfamily-expenses-" + new Date().toISOString().substring(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("importBtn").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });

  document.getElementById("importFile").addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.expenses)) throw new Error("invalid file");

        if (!confirm("This will replace your current data. Continue?")) return;

        expenses = data.expenses;
        categories = Array.isArray(data.categories) && data.categories.length ? data.categories : DEFAULT_CATEGORIES.slice();

        saveExpenses(expenses);
        saveCategories(categories);
        renderCategoryOptions();
        render();
      } catch (e) {
        alert("Failed to load file. Please select a valid JSON file.");
      }
    };
    reader.readAsText(file);
  });

  document.querySelectorAll(".quick-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      const category = btn.getAttribute("data-category");
      const detail = btn.getAttribute("data-detail");

      if (category && categories.includes(category)) {
        categorySelect.value = category;
      }
      document.getElementById("detailInput").value = detail;
      document.getElementById("expenseForm").scrollIntoView({ behavior: "smooth", block: "center" });
      document.getElementById("amountInput").focus();
    });
  });

  // init
  dateInput.value = new Date().toISOString().substring(0, 10);
  renderCategoryOptions();
  render();
})();
</script>

</body>
</html>
